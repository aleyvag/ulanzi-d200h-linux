# =============================================================================
# Página HOME — launchers a las páginas temáticas de los examples.
#
# Schema y referencia completa: docs/yaml_pages_reference.md
#
#   slots:
#     "row_col":                      # row 0-2, col 0-4. 2_3 y 2_4 reservados.
#       fw_action: <Action firmware>  # default: system.open (slot pasivo)
#       fw_param:  <ActionParam>
#       icon:      <nombre del PNG>   # config/icons/ o assets/firmware-icons/
#       text:      <texto bajo el icono>
#       host_action: <acción que ejecuta el bridge al pulsar>
# =============================================================================

title: "Home"
brightness: 60

slots:
  # Fila 0: navegación a las 4 páginas temáticas (forma recomendada,
  # `fw_action: page.goto` — el firmware no manda IN al host, lo cambia
  # directamente desde su lado).
  "0_0": {fw_action: page.goto, fw_param: {Page: "hotkeys"}, icon: btn_goToPage, text: "HOTKEYS"}
  "0_1": {fw_action: page.goto, fw_param: {Page: "media"},   icon: btn_goToPage, text: "MEDIA"}
  "0_2": {fw_action: page.goto, fw_param: {Page: "system"},  icon: btn_goToPage, text: "SYSTEM"}
  "0_3": {fw_action: page.goto, fw_param: {Page: "apps"},    icon: btn_goToPage, text: "APPS"}

  # Slot decorativo: indicador de página. La app oficial lo usa para
  # "Page N/M"; aquí sólo muestra texto.
  "0_4": {fw_action: page.indicator, text: "1/1"}

  # Fila 1: ejemplos sueltos para mostrar host_actions variadas.
  "1_0": {host_action: {type: notify, summary: "D200H", body: "ping"}, text: "Ping"}
  "1_1": {host_action: {type: url, url: "https://github.com"},          text: "URL"}
  "1_2":
    host_action:
      type: shell
      cmd: "notify-send 'D200H' \"$(date '+%H:%M:%S')\""
    text: "Time"

  # Ejemplo de host_action: page — cambia de página desde el host
  # en lugar de pedirle al firmware que lo haga (útil si quieres
  # encadenar una acción + cambio de página vía type: multi).
  "1_3": {host_action: {type: page, target: "media"}, text: "→Media"}
  "1_4": {host_action: {type: page, target: "apps"},  text: "→Apps"}
